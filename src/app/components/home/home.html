<p>home works, {{ name }}!</p>

<ul>
   @for (item of name; track item && $index) {
    <li> {{ name[$index] }} </li>
   } 
</ul>

<button [attr.aria-label]="name" (click)="submit()">{{name}}</button>

@if(mustShowTitle){
    <h1>Título: {{ firstName }} {{ name }}</h1>
} @else {
    <h2>Has no Title</h2>
}
